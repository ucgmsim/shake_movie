name: Publish to PyPI
run-name: Publish Python Package to PyPI for release ${{ github.event.release.tag_name || inputs.tag_name || github.ref_name }}

# A published GitHub release builds the wheel and sdist at its tag and uploads
# them through PyPI's trusted publishing; setuptools-scm takes the version from
# the tag.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Git tag to checkout and publish"
        required: false
        type: string

jobs:
  build:
    name: Build distribution 📦
    # Pure Python, so one py3-none-any wheel serves every interpreter and
    # platform: no build matrix.
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4.1.0
        with:
          ref: ${{ inputs.tag_name || github.ref }}
          # setuptools-scm derives the version from the tag, so it needs the
          # full history rather than a shallow clone.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Build wheel and source distribution
        run: |
          python3 -m pip install build
          python3 -m build

      - name: Store the distribution packages
        uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error

  publish-to-pypi:
    name: Publish to PyPI
    needs:
      - build
    runs-on: ubuntu-latest

    environment:
      name: pypi
      url: https://pypi.org/p/shake-movie

    permissions:
      id-token: write

    steps:
      - name: Download the dists
        uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish distribution to PyPI
        uses: pypa/gh-action-pypi-publish@v1.13.0
        with:
          packages-dir: dist
